[project]
name = "ufc-next-word"
version = "1.0.0"
description = "BiRNN and TextCNN next-word prediction for modern UFC sentences"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "torch>=2.2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ufc_next_word"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

